services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: underwriting
      POSTGRES_USER: underwriting
      POSTGRES_PASSWORD: underwriting_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underwriting -d underwriting"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://underwriting:underwriting_dev@postgres:5432/underwriting
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TRANSACTION_CLASSIFIER_MODEL: ${TRANSACTION_CLASSIFIER_MODEL:-gpt-5.6-terra}
      OBJECT_STORAGE_BACKEND: local
      LOCAL_OBJECT_STORAGE_ROOT: /data/uploads
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - statement_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  statement_uploads:
